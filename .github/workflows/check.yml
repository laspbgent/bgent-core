name: check

# The crate's own gate. Two jobs, because they prove different things:
#
#   no-game  — a checkout without the games submodule must FAIL to build. If this
#              passes, the game is not really part of the crate and the whole
#              structure has quietly stopped meaning anything.
#   check    — with the submodule mounted and the baseline game installed, the
#              contract is intact, the reference passes the harness, and all eight
#              fixtures still fail for the documented reasons.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  no-game:
    name: A crate with no games module must not build
    runs-on: ubuntu-latest
    steps:
      - name: Check out without submodules
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build must fail
        run: |
          if cargo build --locked 2>build-error.log; then
            echo "::error::the crate built without a games module — game code is not part of the crate"
            exit 1
          fi
          echo "build failed as intended:"
          grep -m1 "file not found for module" build-error.log || cat build-error.log

  check:
    name: Full check with the games module
    runs-on: ubuntu-latest
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: The games module is really mounted
        run: |
          test -f src/games/mod.rs || { echo "::error::src/games/mod.rs missing — submodule not mounted"; exit 1; }
          test -f src/games/current.rs || { echo "::error::src/games/current.rs missing"; exit 1; }
          echo "games module at $(git -C src/games rev-parse --short HEAD)"

      - name: Contract is unmodified
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys
          want = pathlib.Path("scripts/contract.sha256").read_text().split()[0]
          got = hashlib.sha256(pathlib.Path("src/combinatorial_game.rs").read_bytes()).hexdigest()
          print("contract", got)
          if got != want:
              sys.exit("src/combinatorial_game.rs has drifted from the pinned contract")
          PY

      - name: Build
        run: cargo build --locked

      - name: Unit tests (reference game)
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Reference game passes the harness
        run: |
          cargo run --quiet -- check --json --out report.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("report.json"))
          print("errors:", d["counts"]["errors"], "warnings:", d["counts"]["warnings"])
          if not d["ok"]:
              print(json.dumps(d["findings"], indent=2))
              sys.exit("the reference game must always pass")
          PY

      - name: Every fixture behaves as documented
        run: |
          set -o pipefail
          python3 scripts/verify_fixtures.py 2>&1 | tee fixture-verify.log

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: |
            report.json
            fixture-verify.log
            build-error.log

      # The job-log endpoint redirects and our client cannot follow it, so on failure
      # the output is committed to a branch instead of being unreachable.
      - name: Publish the failure log
        if: failure()
        run: |
          set -e
          git config user.name  "bgent-ci"
          git config user.email "bgent-ci@users.noreply.github.com"
          mkdir -p ci-logs
          cp fixture-verify.log "ci-logs/fixtures-${GITHUB_SHA:0:10}.log" 2>/dev/null || true
          cp build-error.log    "ci-logs/build-${GITHUB_SHA:0:10}.log"    2>/dev/null || true
          git checkout -B ci-logs
          git add -f ci-logs
          git commit -m "ci: verification output for ${GITHUB_SHA:0:10}" || true
          git push -f origin ci-logs
