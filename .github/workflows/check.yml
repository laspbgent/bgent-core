name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Contract is unmodified
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys
          want = pathlib.Path("scripts/contract.sha256").read_text().split()[0]
          got = hashlib.sha256(pathlib.Path("src/combinatorial_game.rs").read_bytes()).hexdigest()
          print("contract", got)
          if got != want:
              sys.exit("src/combinatorial_game.rs has drifted from the pinned contract")
          PY

      - name: Build
        run: cargo build --locked

      - name: Unit tests (reference game)
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Reference game passes the harness
        run: |
          cargo run --quiet -- check --json --out report.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("report.json"))
          print("errors:", d["counts"]["errors"], "warnings:", d["counts"]["warnings"])
          if not d["ok"]:
              print(json.dumps(d["findings"], indent=2))
              sys.exit("the reference game must always pass")
          PY

      - name: Every fixture behaves as documented
        id: fixtures
        run: |
          set -o pipefail
          python3 scripts/verify_fixtures.py 2>&1 | tee fixture-verify.log

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: |
            report.json
            fixture-verify.log

      # GitHub's job-log endpoint answers with a redirect that our client cannot
      # follow, so on failure the verifier's output is committed to a branch
      # instead. That is the only way the failure text reaches the author.
      - name: Publish the failure log
        if: failure()
        run: |
          set -e
          git config user.name  "bgent-ci"
          git config user.email "bgent-ci@users.noreply.github.com"
          mkdir -p ci-logs
          cp fixture-verify.log "ci-logs/fixtures-${GITHUB_SHA:0:10}.log"
          git checkout -B ci-logs
          git add -f ci-logs
          git commit -m "ci: fixture verification output for ${GITHUB_SHA:0:10}"
          git push -f origin ci-logs
